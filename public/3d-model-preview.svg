<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">LinkoTech 3D two story structural frame</title><desc id="d">Three dimensional structural model showing a two story, three bay steel frame with beams, columns, braces and floor slabs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9fc"/><stop offset="1" stop-color="#dce8f0"/></linearGradient><linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9d3ee" stop-opacity=".64"/><stop offset="1" stop-color="#4f8cff" stop-opacity=".28"/></linearGradient><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#b9c8d3" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".45"/><ellipse cx="820" cy="758" rx="570" ry="88" fill="#7890a0" opacity=".12"/>
