<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 75 1600 820" role="img" aria-labelledby="t d"><title id="t">Linkoteq 3D two story structural frame</title><desc id="d">Three dimensional structural model showing a two story, three bay steel frame with beams, columns, braces and floor slabs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8f5"/><stop offset="1" stop-color="#deeee8"/></linearGradient><linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92d0c3" stop-opacity=".64"/><stop offset="1" stop-color="#0f8f83" stop-opacity=".28"/></linearGradient><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#a8c8be" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)" opacity=".45"/><ellipse cx="820" cy="758" rx="570" ry="88" fill="#47786a" opacity=".12"/>
<g transform="translate(150 24) scale(.86)">
<!-- floor slabs -->
<path d="M250 595 L880 745 L1260 520 L630 380 Z" fill="url(#slab)" stroke="#0f8f83" stroke-width="3"/>
<path d="M250 355 L880 500 L1260 278 L630 142 Z" fill="url(#slab)" stroke="#0f8f83" stroke-width="3"/>
<!-- columns: 4 front/back lines, two stories -->
<g stroke="#48645c" stroke-width="17" stroke-linecap="round">
<path d="M250 790V355 M460 840V405 M670 890V455 M880 940V500"/>
<path d="M630 575V142 M840 625V190 M1050 675V235 M1260 725V278"/>
</g>
<!-- story beams front -->
<g stroke="#14352e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
<path d="M250 595L460 645L670 695L880 745 M250 355L460 405L670 455L880 500"/>
<path d="M630 380L840 430L1050 475L1260 520 M630 142L840 190L1050 235L1260 278"/>
<!-- transverse beams -->
<path d="M250 595L630 380 M460 645L840 430 M670 695L1050 475 M880 745L1260 520"/>
<path d="M250 355L630 142 M460 405L840 190 M670 455L1050 235 M880 500L1260 278"/>
</g>
<!-- braces -->
<g stroke="#0f8f83" stroke-width="12" stroke-linecap="round">
<path d="M250 790L460 645 M460 840L250 595 M670 890L880 745 M880 940L670 695"/>
<path d="M250 595L460 405 M460 645L250 355 M670 695L880 500 M880 745L670 455"/>
<path d="M1050 675L1260 520 M1260 725L1050 475 M1050 475L1260 278 M1260 520L1050 235"/>
</g>
<!-- nodes -->
<g fill="#0f8f83" stroke="#fff" stroke-width="3">
<circle cx="250" cy="595" r="9"/><circle cx="460" cy="645" r="9"/><circle cx="670" cy="695" r="9"/><circle cx="880" cy="745" r="9"/>
<circle cx="630" cy="380" r="9"/><circle cx="840" cy="430" r="9"/><circle cx="1050" cy="475" r="9"/><circle cx="1260" cy="520" r="9"/>
<circle cx="250" cy="355" r="9"/><circle cx="460" cy="405" r="9"/><circle cx="670" cy="455" r="9"/><circle cx="880" cy="500" r="9"/>
<circle cx="630" cy="142" r="9"/><circle cx="840" cy="190" r="9"/><circle cx="1050" cy="235" r="9"/><circle cx="1260" cy="278" r="9"/>
</g></g>
</svg>
