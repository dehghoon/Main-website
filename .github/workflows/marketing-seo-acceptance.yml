name: Marketing SEO acceptance
on:
  pull_request:
    paths:
      - 'app/blog/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'contracts/marketing/**'
      - 'scripts/validate-*contract.mjs'
      - 'scripts/validate-shared-marketing-policy.mjs'
      - 'tests/marketing-seo-contract.test.mjs'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:marketing-seo
