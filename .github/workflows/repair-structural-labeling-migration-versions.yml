name: Repair Structural Labeling Migration Versions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize migration filenames
        shell: bash
        run: |
          set -euo pipefail

          old_source="supabase/migrations/20261004_structural_labeling_milestone2_source_read.sql"
          precreated_source="supabase/migrations/20261004000600_structural_labeling_milestone2_source_read.sql"

          if [ -f "$precreated_source" ] && [ -f "$old_source" ]; then
            cmp --silent "$precreated_source" "$old_source"
            git rm "$precreated_source"
          fi

          git mv supabase/migrations/20261004_structural_labeling_foundation.sql             supabase/migrations/20261004000100_structural_labeling_foundation.sql
          git mv supabase/migrations/20261004_structural_labeling_milestone2_authorization.sql             supabase/migrations/20261004000200_structural_labeling_milestone2_authorization.sql
          git mv supabase/migrations/20261004_structural_labeling_milestone2_rpc_core.sql             supabase/migrations/20261004000300_structural_labeling_milestone2_rpc_core.sql
          git mv supabase/migrations/20261004_structural_labeling_milestone2_rpc_review.sql             supabase/migrations/20261004000400_structural_labeling_milestone2_rpc_review.sql
          git mv supabase/migrations/20261004_structural_labeling_milestone2_security_finalize.sql             supabase/migrations/20261004000500_structural_labeling_milestone2_security_finalize.sql
          git mv "$old_source" "$precreated_source"
          git mv supabase/migrations/20261004_structural_labeling_milestone2_upload_batch.sql             supabase/migrations/20261004000700_structural_labeling_milestone2_upload_batch.sql
          git mv supabase/migrations/20261006_structural_labeling_direct_mutation_lockdown.sql             supabase/migrations/20261006000100_structural_labeling_direct_mutation_lockdown.sql

          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          versions = [
              path.name.split("_", 1)[0]
              for path in Path("supabase/migrations").glob("*structural_labeling*.sql")
          ]
          counts = Counter(versions)
          duplicates = [version for version, count in counts.items() if count > 1]
          invalid = [version for version in versions if len(version) != 14 or not version.isdigit()]
          if duplicates or invalid:
              raise SystemExit(f"Invalid Structural Labeling migration identities: duplicates={duplicates}, invalid={invalid}")
          PY

          git diff --check
          git status --short

      - name: Commit migration version repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Normalize structural labeling migration versions"
          git push origin HEAD:main
