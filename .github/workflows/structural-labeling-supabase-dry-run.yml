name: Structural Labeling Supabase Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structural-labeling-supabase-production
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_URL"

      - name: Validate Structural Labeling migration identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path

          paths = sorted(Path("supabase/migrations").glob("*structural_labeling*.sql"))
          if not paths:
              raise SystemExit("No Structural Labeling migrations found.")

          versions = [path.name.split("_", 1)[0] for path in paths]
          duplicates = [version for version, count in Counter(versions).items() if count > 1]
          invalid = [version for version in versions if len(version) != 14 or not version.isdigit()]

          if duplicates or invalid:
              raise SystemExit(
                  f"Invalid migration identities: duplicates={duplicates}, invalid={invalid}"
              )

          print("Structural Labeling migration identities are unique and canonical.")
          for path in paths:
              print(path.name)
          PY

      - name: Initialize Supabase CLI project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link deployed Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Capture deployed migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" | tee migration-list-before.txt

      - name: Dry-run committed migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee migration-dry-run.txt

      - name: Enforce Structural Labeling pending migration allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          approved = {
              "20261004000100_structural_labeling_foundation.sql",
              "20261004000200_structural_labeling_milestone2_authorization.sql",
              "20261004000300_structural_labeling_milestone2_rpc_core.sql",
              "20261004000400_structural_labeling_milestone2_rpc_review.sql",
              "20261004000500_structural_labeling_milestone2_security_finalize.sql",
              "20261004000600_structural_labeling_milestone2_source_read.sql",
              "20261004000700_structural_labeling_milestone2_upload_batch.sql",
              "20261006000100_structural_labeling_direct_mutation_lockdown.sql",
          }

          text = Path("migration-dry-run.txt").read_text()
          found = set(re.findall(r"\b\d{14}_[A-Za-z0-9_.-]+\.sql\b", text))

          if not found:
              raise SystemExit("No pending migration filenames were found in dry-run output.")

          unexpected = sorted(found - approved)
          missing = sorted(approved - found)

          print("Pending migrations reported by Supabase:")
          for name in sorted(found):
              print(name)

          if unexpected:
              raise SystemExit(f"Unapproved pending migrations detected: {unexpected}")

          if missing:
              raise SystemExit(f"Approved Structural Labeling migrations missing from pending set: {missing}")

          print("Pending migration set exactly matches the approved Structural Labeling allowlist.")
          PY

      - name: Add dry-run summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Structural Labeling Supabase Dry Run"
            echo
            echo "No database migration was applied by this workflow."
            echo
            echo "## Migration history"
            echo '```text'
            if [ -f migration-list-before.txt ]; then
              cat migration-list-before.txt
            else
              echo "Migration history was not captured."
            fi
            echo '```'
            echo
            echo "## db push --dry-run"
            echo '```text'
            if [ -f migration-dry-run.txt ]; then
              cat migration-dry-run.txt
            else
              echo "Dry-run output was not captured."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-labeling-supabase-dry-run-evidence
          path: |
            migration-list-before.txt
            migration-dry-run.txt
          if-no-files-found: warn
          retention-days: 14
