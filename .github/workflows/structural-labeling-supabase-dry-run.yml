name: Structural Labeling Supabase Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structural-labeling-supabase-production
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_URL"

      - name: Validate migration verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-structural-labeling-migrations.py

      - name: Initialize Supabase CLI project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link deployed Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Capture deployed migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee migration-list-before.txt

      - name: Capture remote migration versions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL"             --no-psqlrc             --tuples-only             --no-align             --command "select version from supabase_migrations.schema_migrations order by version;"             | sed '/^[[:space:]]*$/d'             | tee remote-migration-versions.txt

      - name: Enforce Structural Labeling pending migration allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-structural-labeling-migrations.py             --remote-file remote-migration-versions.txt             --expect pending

      - name: Dry-run committed migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1 | tee migration-dry-run.txt

      - name: Add dry-run summary
        if: always()
        shell: bash
        run: |
          printf '%s\n'             '# Structural Labeling Supabase Dry Run'             ''             'No database migration was applied by this workflow.'             ''             'Evidence files are attached as the workflow artifact.'             >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-labeling-supabase-dry-run-evidence
          path: |
            migration-list-before.txt
            remote-migration-versions.txt
            migration-dry-run.txt
          if-no-files-found: warn
          retention-days: 14
