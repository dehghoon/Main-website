name: Validate Linkoteq blog cover generation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-blog-cover.mjs'
      - 'scripts/render-blog-cover-jpeg.mjs'
      - 'scripts/upload-blog-cover.mjs'
      - '.github/workflows/validate-blog-cover.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate and render a sample cover without external APIs
        run: |
          set -euo pipefail
          SLUG="ci-cover-check-${GITHUB_RUN_ID}"
          node scripts/generate-blog-cover.mjs --slug "$SLUG" --title "Seven Checks Before Trusting a Converted Structural Model" --subtitle "Geometry, units, materials and fidelity"
          node scripts/render-blog-cover-jpeg.mjs "$SLUG"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const name=process.argv[1];
            const svg=readFileSync("public/blog/covers/"+name+".svg","utf8");
            const jpg=readFileSync("public/blog/covers/"+name+".jpg");
            if(!svg.includes("<svg")||jpg.length<1024||jpg[0]!==255||jpg[1]!==216||jpg[jpg.length-2]!==255||jpg[jpg.length-1]!==217)process.exit(1);
            console.log("SVG and JPEG smoke test passed; JPEG bytes:",jpg.length);
          ' "$SLUG"
          rm "public/blog/covers/$SLUG.svg" "public/blog/covers/$SLUG.jpg"
