name: Structural Labeling CI

on:
  push:
    branches: [main]
    paths:
      - "app/structural-labeling/**"
      - "lib/structural-labeling/**"
      - "tests/structural-labeling.test.ts"
      - "supabase/migrations/20261004_structural_labeling_foundation.sql"
      - "package.json"
      - ".github/workflows/structural-labeling-ci.yml"
  pull_request:
    paths:
      - "app/structural-labeling/**"
      - "lib/structural-labeling/**"
      - "tests/structural-labeling.test.ts"
      - "supabase/migrations/20261004_structural_labeling_foundation.sql"
      - "package.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Structural labeling tests
        run: npm run test:labeling
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
