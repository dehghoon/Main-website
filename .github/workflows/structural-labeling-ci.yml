name: Structural Labeling CI

on:
  push:
    branches: [main]
    paths:
      - "app/structural-labeling/**"
      - "app/api/structural-labeling/**"
      - "lib/structural-labeling/**"
      - "contracts/gpt7/**"
      - "tests/structural-labeling*.test.ts"
      - "supabase/migrations/*structural_labeling*.sql"
      - "scripts/import-structural-labeling-candidates.mjs"
      - "package.json"
      - ".github/workflows/structural-labeling-ci.yml"
  pull_request:
    paths:
      - "app/structural-labeling/**"
      - "app/api/structural-labeling/**"
      - "lib/structural-labeling/**"
      - "contracts/gpt7/**"
      - "tests/structural-labeling*.test.ts"
      - "supabase/migrations/*structural_labeling*.sql"
      - "scripts/import-structural-labeling-candidates.mjs"
      - "package.json"
      - ".github/workflows/structural-labeling-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Historical import dry run
        id: historical
        shell: bash
        run: |
          set +e
          DETECTION_RUNS_REF=qa-review-artifacts           DETECTION_RUNS_PATH=runs           DETECTION_ZIP_REF=main           DETECTION_ZIP_PATH=remaing-15-existing-images.zip           npm run import:labeling > historical-dry-run.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            summary=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("historical-dry-run.json","utf8")); const y={runIdsInspected:x.runIdsInspected,imageContainingRunIds:x.imageContainingRunIds,jsonOnlyRunId:x.jsonOnlyRunId,recursiveImageCountPerRun:x.recursiveImageCountPerRun,sourceCandidateImageCountPerRun:x.sourceCandidateImageCountPerRun,zipImageCount:x.zipImageCount,totalRawCandidateCount:x.totalRawCandidateCount,exactSha256DuplicateCount:x.exactSha256DuplicateCount,uniqueSha256CandidateCount:x.uniqueSha256CandidateCount,nearDuplicateStatus:x.nearDuplicateStatus,enablesTraining:x.enablesTraining}; process.stdout.write(JSON.stringify(y))')
            echo "::notice title=Historical import dry run::$summary"
          else
            echo "::error title=Historical import dry run::exit_code=$code"
            cat historical-dry-run.json || true
          fi
          exit 0

      - name: Structural labeling tests
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:labeling
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Structural labeling tests::exit_code=$code"
          exit 0

      - name: Type check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Type check::exit_code=$code"
          exit 0

      - name: Production build
        id: build
        shell: bash
        run: |
          set +e
          npm run build
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Production build::exit_code=$code"
          exit 0

      - name: Verification gate
        shell: bash
        run: |
          echo "::notice title=Verification gate::historical=${{ steps.historical.outputs.exit_code }} tests=${{ steps.tests.outputs.exit_code }} typecheck=${{ steps.typecheck.outputs.exit_code }} build=${{ steps.build.outputs.exit_code }}"
          test "${{ steps.historical.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.typecheck.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
