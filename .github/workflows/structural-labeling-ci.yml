name: Structural Labeling CI
on:
  push:
    branches: [main]
    paths:
      - "app/structural-labeling/**"
      - "app/api/structural-labeling/**"
      - "lib/structural-labeling/**"
      - "contracts/gpt7/**"
      - "tests/structural-labeling*.test.ts"
      - "supabase/migrations/*structural_labeling*.sql"
      - "scripts/discover-structural-labeling-candidates.mjs"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/structural-labeling-ci.yml"
  pull_request:
    paths:
      - "app/structural-labeling/**"
      - "app/api/structural-labeling/**"
      - "lib/structural-labeling/**"
      - "contracts/gpt7/**"
      - "tests/structural-labeling*.test.ts"
      - "supabase/migrations/*structural_labeling*.sql"
      - "scripts/discover-structural-labeling-candidates.mjs"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/structural-labeling-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Historical discovery dry run
        id: historical
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DETECTION_RUNS_REF: qa-review-artifacts
          DETECTION_RUNS_PATH: runs
          DETECTION_ZIP_REF: main
          DETECTION_ZIP_PATH: remaing-15-existing-images.zip
        run: |
          set +e
          node scripts/discover-structural-labeling-candidates.mjs > historical-dry-run.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            summary=$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("historical-dry-run.json","utf8")); const y={runIdsInspected:x.runIdsInspected,imageContainingRunIds:x.imageContainingRunIds,jsonOnlyRunId:x.jsonOnlyRunId,sourceCandidateImageCountPerRun:x.sourceCandidateImageCountPerRun,zipImageCount:x.zipImageCount,totalOriginRecordCount:x.totalOriginRecordCount,uniqueSha256ContentIdentityCount:x.uniqueSha256ContentIdentityCount,exactSha256DuplicateOriginCount:x.exactSha256DuplicateOriginCount,exactSha256DuplicateGroupCount:x.exactSha256DuplicateGroupCount,nearDuplicateStatus:x.nearDuplicateStatus,databaseWrites:x.databaseWrites,enablesTraining:x.enablesTraining}; process.stdout.write(JSON.stringify(y))')
            echo "::notice title=Historical discovery dry run::$summary"
          else
            echo "::error title=Historical discovery dry run::exit_code=$code"
            cat historical-dry-run.json || true
          fi
          exit 0

      - name: Structural labeling tests
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:labeling 2>&1 | tee test-labeling.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Structural labeling tests::exit_code=$code"
          if [ "$code" -ne 0 ]; then
            echo "# Structural labeling test failure" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test-labeling.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "not ok|AssertionError|failureType|error:|code:|expected:|actual:|ERR_|location:" test-labeling.log | tail -n 60 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=Structural labeling test failure::$line"
            done
          fi
          exit 0

      - name: Upload labeling test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-labeling-test-log
          path: test-labeling.log
          if-no-files-found: warn
          retention-days: 14

      - name: Type check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Type check::exit_code=$code"
          exit 0

      - name: Production build
        id: build
        shell: bash
        run: |
          set +e
          npm run build
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Production build::exit_code=$code"
          exit 0

      - name: Verification gate
        shell: bash
        run: |
          echo "::notice title=Verification gate::historical=${{ steps.historical.outputs.exit_code }} tests=${{ steps.tests.outputs.exit_code }} typecheck=${{ steps.typecheck.outputs.exit_code }} build=${{ steps.build.outputs.exit_code }}"
          test "${{ steps.historical.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.typecheck.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
