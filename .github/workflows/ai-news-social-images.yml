# Manual creative workflow: images are created with the owner in ChatGPT.
# Kept as a disabled legacy workflow for audit and rollback.
name: AI news image generator (disabled - manual creative approval)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-image-generation-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic image generation is disabled. Prepare images manually and publish only on explicit owner request."
