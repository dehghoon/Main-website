name: Prepare AI engineering social news images
on:
  schedule:
    # Toronto 10:07, 10:37, 11:07, 11:37; both DST offsets
    # Extra UTC hour is skipped outside 10:00-11:59 Toronto
    - cron: '7,37 14,15,16 * * 2,4,6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linkoteq-ai-news-social-images
  cancel-in-progress: false
jobs:
  prepare-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Generate and verify queued news JPEGs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prepare-ai-news-social-images.mjs
