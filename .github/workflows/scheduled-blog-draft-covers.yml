name: Scheduled Linkoteq blog draft covers
on:
  schedule:
    # Poll for missing draft covers through Toronto business hours; never publishes.
    - cron: '17,47 13-23 * * 1,3'
  workflow_dispatch:
    inputs:
      replace_post_id:
        description: "Optional existing draft ID to regenerate its cover (never publishes)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/generate-blog-cover.mjs'
      - '.github/workflows/scheduled-blog-draft-covers.yml'
permissions:
  contents: read
concurrency:
  group: linkoteq-scheduled-blog-draft-covers
  cancel-in-progress: false
jobs:
  prepare-draft-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Prepare eligible draft JPEG covers and attach to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPLACE_POST_ID: ${{ inputs.replace_post_id }}
        run: node scripts/prepare-scheduled-blog-covers.mjs
