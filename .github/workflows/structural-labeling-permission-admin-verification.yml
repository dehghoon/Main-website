name: Structural Labeling Permission Admin Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Validate verification SQL exists
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/structural-labeling-permission-admin-runtime-verification.sql

      - name: Verify deployed permission administration security
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL"             --no-psqlrc             --set ON_ERROR_STOP=1             --file scripts/structural-labeling-permission-admin-runtime-verification.sql             2>&1 | tee permission-admin-runtime-verification.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-labeling-permission-admin-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: permission-admin-runtime-verification.txt
          if-no-files-found: warn
          retention-days: 14
