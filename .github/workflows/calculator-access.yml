name: Calculator access
on:
  pull_request:
    paths:
      - 'app/api/entitlements/execution/**'
      - 'app/api/calculators/wood/**'
      - 'app/api/calculators/concrete/**'
      - 'app/tools/concrete-beam/**'
      - 'app/components/member-viewer*'
      - 'app/tools/wood-design/**'
      - 'app/account/header-session/**'
      - 'lib/tool-access/**'
      - 'lib/wood-material-catalog.ts'
      - 'app/account/tool-session/**'
      - 'app/blog/login/**'
      - 'app/customer-login/**'
      - 'tests/session-handoff.test.ts'
      - 'tests/wood-material-catalog.test.ts'
      - 'next.config.mjs'
      - 'tests/tool-execution-policy.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/calculator-access.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/tool-execution-policy.test.ts tests/session-handoff.test.ts tests/wood-material-catalog.test.ts
      - run: npm run typecheck
      - run: npm run test:marketing-seo
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
